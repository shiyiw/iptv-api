# Authoritative spec for the `iptv` container actually running on this host.
# Reproduces the hand-run container (verified via `docker inspect iptv`):
# image, host networking, bind mounts, and env. The image is pulled through
# the docker.jiaxin.site mirror. public_url for generated links is set in
# config/config.ini (mounted), not here.
services:
  iptv:
    image: docker.jiaxin.site/guovern/iptv-api:latest
    container_name: iptv
    restart: unless-stopped
    network_mode: host
    volumes:
      - /Users/yishi/code/iptv-api/config:/iptv-api/config
      - /Users/yishi/code/iptv-api/output:/iptv-api/output
    environment:
      UPDATE_CRON: "0 22,10 * * *"
      APP_WORKDIR: /iptv-api
      APP_PORT: "5180"
      NGINX_HTTP_PORT: "8080"
      NGINX_RTMP_PORT: "1935"
      PUBLIC_PORT: "8080"   # nginx listens on 8080 (host network); must match NGINX_HTTP_PORT
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
      CDN_URL: ""
      HTTP_PROXY: ""
